server {
    listen 80;
    listen [::]:80;
    server_name play.xedoc.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.xedoc.ru;

    root /var/www/play.xedoc.ru/current/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/play.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/play.xedoc.ru.access.log;
    error_log  /var/log/nginx/play.xedoc.ru.error.log warn;

    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3037;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        proxy_redirect off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
